<!DOCTYPE html>

<html lang="es"><head>

                        "surface-container-lowest": "#ffffff",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .stepper-btn:active {
            transform: scale(0.9);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center justify-between px-container-margin h-14 w-full bg-surface border-b border-outline-variant">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" data-icon="playing_cards">playing_cards</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Retruco</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</header>
<main class="max-w-md mx-auto px-container-margin py-lg space-y-lg">
<!-- Section Header -->
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined text-on-surface-variant" data-icon="arrow_back">arrow_back</button>
<h2 class="font-headline-md text-headline-md">Agregar Partido</h2>
</div>
<form class="space-y-xl" onsubmit="event.preventDefault();">
<!-- Jornada Selector -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">JORNADA</label>
<div class="relative">
<select class="w-full h-14 px-md bg-surface border border-outline-variant rounded-xl appearance-none focus:ring-2 focus:ring-primary focus:outline-none transition-all">
<option selected="">Jornada 3 — Serie Lunes</option>
<option>Jornada 2 — Serie Miércoles</option>
<option>Jornada 1 — Serie Viernes</option>
</select>
<span class="material-symbols-outlined absolute right-md top-4 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Teams Selection -->
<div class="grid grid-cols-1 gap-lg">
<!-- Pair 1 -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">PAREJA 1</label>
<div class="relative">
<select class="w-full h-14 px-md bg-surface border border-outline-variant rounded-xl appearance-none focus:ring-2 focus:ring-primary focus:outline-none">
<option selected="">García / Rodríguez</option>
<option>López / Pérez</option>
</select>
<span class="material-symbols-outlined absolute right-md top-4 pointer-events-none text-on-surface-variant" data-icon="group">group</span>
</div>
</div>
<!-- Pair 2 -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">PAREJA 2</label>
<div class="relative">
<select class="w-full h-14 px-md bg-surface border border-outline-variant rounded-xl appearance-none focus:ring-2 focus:ring-primary focus:outline-none">
<option selected="">Silva / Núñez</option>
<option>Fernández / Sosa</option>
</select>
<span class="material-symbols-outlined absolute right-md top-4 pointer-events-none text-on-surface-variant" data-icon="group">group</span>
</div>
</div>
</div>
<!-- Score Input Area (Large Touch Targets) -->
<div class="bg-surface-container-low p-md rounded-xl space-y-lg border border-outline-variant">
<div class="grid grid-cols-2 gap-md">
<!-- Score 1 -->
<div class="flex flex-col items-center space-y-sm">
<span class="font-label-sm text-label-sm text-primary uppercase">Puntos P1</span>
<div class="flex items-center gap-xs">
<button class="stepper-btn w-12 h-14 flex items-center justify-center bg-surface border border-outline-variant rounded-lg text-primary" onclick="changeValue('p1', -1)" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<input class="w-16 h-14 text-center font-ranking-number text-ranking-number bg-surface border-none rounded-lg focus:ring-0" id="score-p1" readonly="" type="number" value="40"/>
<button class="stepper-btn w-12 h-14 flex items-center justify-center bg-surface border border-outline-variant rounded-lg text-primary" onclick="changeValue('p1', 1)" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Score 2 -->
<div class="flex flex-col items-center space-y-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Puntos P2</span>
<div class="flex items-center gap-xs">
<button class="stepper-btn w-12 h-14 flex items-center justify-center bg-surface border border-outline-variant rounded-lg text-on-surface-variant" onclick="changeValue('p2', -1)" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<input class="w-16 h-14 text-center font-ranking-number text-ranking-number bg-surface border-none rounded-lg focus:ring-0" id="score-p2" readonly="" type="number" value="28"/>
<button class="stepper-btn w-12 h-14 flex items-center justify-center bg-surface border border-outline-variant rounded-lg text-on-surface-variant" onclick="changeValue('p2', 1)" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- Preview Card -->
<div class="bg-secondary-container/30 border border-secondary-container p-md rounded-xl flex items-center gap-md">
<div class="w-10 h-10 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary-container shrink-0">
<span class="material-symbols-outlined" data-icon="emoji_events" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-secondary-container uppercase tracking-wider">PREVISUALIZACIÓN</p>
<p class="font-body-md text-body-md font-bold text-on-secondary-container">Ganador: García / Rodríguez (40 tantos)</p>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-gold text-on-tertiary-fixed font-bold rounded-xl flex items-center justify-center gap-sm active:scale-95 transition-all shadow-lg" type="submit">
<span class="material-symbols-outlined" data-icon="save">save</span>
<span>Guardar Partido</span>
</button>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-4 pb-safe bg-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.1)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:bg-surface-container-low" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Inicio</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant transition-all hover:bg-surface-container-low" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-sm text-label-sm">Tabla Global</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold scale-90 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="admin_panel_settings" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
<span class="font-label-sm text-label-sm">Admin</span>
</a>
</nav>
<script>
        function changeValue(target, delta) {
            const input = document.getElementById('score-' + target);
            let val = parseInt(input.value);
            val = Math.max(0, val + delta);
            input.value = val;
            
            // Micro-interaction: Update winner preview logically (simplified demo)
            updatePreview();
        }

        function updatePreview() {
            const p1 = parseInt(document.getElementById('score-p1').value);
            const p2 = parseInt(document.getElementById('score-p2').value);
            const previewText = document.querySelector('.bg-secondary-container\/30 p.font-bold');
            
            if (p1 > p2) {
                previewText.textContent = `Ganador: García / Rodríguez (${p1} tantos)`;
            } else if (p2 > p1) {
                previewText.textContent = `Ganador: Silva / Núñez (${p2} tantos)`;
            } else {
                previewText.textContent = `Empate: ${p1} - ${p2}`;
            }
        }
    </script>
</body></html>

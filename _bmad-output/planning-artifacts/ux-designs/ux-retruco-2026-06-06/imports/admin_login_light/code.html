<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Retruco - Admin Login</title>

                      "on-tertiary-fixed-variant": "#624000",
                      "inverse-primary": "#8dcdff",

                      "secondary-container": "#beead1",
                      "on-background": "#1c1b1b",
                      "inverse-surface": "#313030",
                      "tertiary-container": "#cd8a00",
                      "on-primary-fixed-variant": "#004b70",
                      "tertiary-fixed": "#ffddb2",
                      "secondary": "#3f6653",
                      "surface-dim": "#dcd9d9",
                      "on-secondary-fixed": "#002114",
                      "primary-container": "#4d9fd6",
                      "surface-container-lowest": "#ffffff",
                      "surface-bright": "#fcf9f8",
                      "surface-container-high": "#ebe7e7",
                      "background": "#fcf9f8",
                      "tertiary-fixed-dim": "#ffb94c",
                      "error": "#ba1a1a",
                      "on-secondary-fixed-variant": "#274e3d",
                      "primary-fixed-dim": "#8dcdff",
                      "on-secondary-container": "#436b58",
                      "outline-variant": "#bfc7d0",
                      "inverse-on-surface": "#f3f0ef",
                      "secondary-fixed": "#c1ecd4",
                      "on-primary-container": "#00334e",

                      "on-tertiary-container": "#442b00",
                      "on-surface": "#1c1b1b",
                      "on-surface-variant": "#40484f",
                      "primary-fixed": "#cae6ff",
                      "outline": "#707880",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf9f8;
            color: #1c1b1b;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .login-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .bg-pattern {
            background-image: radial-gradient(#bfc7d0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center relative px-container-margin">
<!-- Subtle Decorative Background -->
<div class="absolute inset-0 bg-pattern pointer-events-none"></div>
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary opacity-[0.03] blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-container opacity-[0.03] blur-[120px] rounded-full"></div>
<!-- Login Container -->
<main class="w-full max-w-md z-10">
<!-- Header / Logo -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary rounded-xl mb-md">
<span class="material-symbols-outlined text-white text-[48px]" data-icon="playing_cards">playing_cards</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Retruco</h1>
<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest mt-xs">Panel de Administración</p>
</div>
<!-- Card Form -->
<div class="bg-surface-container-lowest border border-outline-variant p-lg rounded-xl login-card">
<form class="space-y-lg" id="loginForm">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="email">Correo Electrónico</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="alternate_email">alternate_email</span>
</div>
<input class="w-full pl-xl pr-md py-md bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/50" id="email" name="email" placeholder="admin@retruco.uy" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="password">Contraseña</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full pl-xl pr-md py-md bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-tertiary-container hover:bg-tertiary text-on-tertiary-fixed font-bold py-md rounded-lg shadow-md transition-all active:scale-95 flex items-center justify-center gap-xs font-headline-md text-headline-md uppercase" type="submit">
                    Ingresar
                    <span class="material-symbols-outlined" data-icon="login">login</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant text-center">
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
</div>
<!-- Footer Help -->
<p class="mt-xl text-center font-label-sm text-label-sm text-outline">
            © 2024 Retruco Championship. Acceso Restringido.
        </p>
</main>
<!-- Micro-interaction for feedback -->
<script>
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalHtml = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-on-tertiary-fixed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="ml-2">Verificando...</span>
            `;

            // Mock success redirect
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    <span class="ml-2">Éxito</span>
                `;
                btn.classList.replace('bg-tertiary-container', 'bg-secondary-container');
                btn.classList.replace('text-on-tertiary-fixed', 'text-on-secondary-container');
                
                setTimeout(() => {
                    // This would be the actual navigation
                    console.log('Redirecting to dashboard...');
                }, 1000);
            }, 1500);
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
